<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070912" />
    <meta name="description" content="AITZAZ AI — TikTok LIVE AI Host" />
    <title>AITZAZ AI — TikTok LIVE Host</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #070912; color: #fff; }
      #boot { min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; }
      #boot-card { text-align: center; padding: 32px; }
      #boot-card strong { display: block; font-size: 28px; letter-spacing: .08em; }
      #boot-card span { display: block; margin-top: 8px; opacity: .7; }
      #boot-error { display: none; margin-top: 18px; color: #ff9b9b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-live="polite">
        <div id="boot-card">
          <strong>AITZAZ AI</strong>
          <span>Starting LIVE host…</span>
          <div id="boot-error">The app could not start. Refresh the page.</div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var el = document.getElementById('boot-error');
        if (el) el.style.display = 'block';
      });
      window.addEventListener('unhandledrejection', function () {
        var el = document.getElementById('boot-error');
        if (el) el.style.display = 'block';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
